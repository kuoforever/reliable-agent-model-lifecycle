name: offline-baseline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-matrix:
    name: python-matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      GIT_LFS_SKIP_SMUDGE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout pointer-only repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""
      - name: Verify exact GitHub-provided HEAD
        run: python -I scripts/validate_repository_ci.py --mode exact-checkout --expected-head "$EXPECTED_HEAD_SHA"
      - name: Validate pointers and standard-library core
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -I scripts/validate_repository_ci.py --mode pointer
      - name: Validate diagnostic v2 focused gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -I scripts/validate_repository_ci.py --mode diagnostic-v2-focused
      - name: Validate local GUI executor contract and prior probe boundaries
        run: python -I -B scripts/validate_local_gui_executor.py --unit-tests
      - name: Validate replacement screen scoring and retained evidence
        run: |
          python -I -B scripts/review_local_gui_probe_v2.py --unit-tests
          python -I -B scripts/review_local_gui_probe_v2.py --check baseline/local-gui-executor-probe-v2.json
      - name: Validate GUI-Owl LoRA split boundaries and retained evidence
        run: python -I -B scripts/review_gui_owl_lora_pilot.py --unit-tests --check
      - name: Validate native GUI binding and retained Runtime conformance
        run: python -I -B scripts/validate_native_gui_proposal.py --unit-tests --check
      - name: Validate GUI observation projection and completeness boundaries
        run: python -I -B scripts/validate_gui_observation_projection.py --unit-tests --check
      - name: Validate inert local-model worker transport
        run: python -I -B tests/test_gui_owl_single.py
      - name: Word image worker transport
        run: python -I -B tests/test_gui_owl_word.py

  hydrated-lfs-integrity:
    name: hydrated-lfs-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout pointer-only repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: ""
      - name: Verify exact GitHub-provided HEAD
        run: python -I scripts/validate_repository_ci.py --mode exact-checkout --expected-head "$EXPECTED_HEAD_SHA"
      - name: Validate immutable hydrated anchor inheritance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -I scripts/validate_repository_ci.py --mode trusted-anchor
