name: offline-baseline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-matrix:
    name: python-matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout pointer-only repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""
      - name: Validate pointers and standard-library core
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -I scripts/validate_repository_ci.py --mode pointer
      - name: Validate diagnostic v2 focused gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -I scripts/validate_repository_ci.py --mode diagnostic-v2-focused

  hydrated-lfs-integrity:
    name: hydrated-lfs-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout pointer-only repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: ""
      - name: Validate immutable hydrated anchor inheritance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -I scripts/validate_repository_ci.py --mode trusted-anchor
